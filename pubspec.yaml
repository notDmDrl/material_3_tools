name: material_3_tools
description: Utils that simplify usage of Material Design 3 Expressive (M3X) theming available in Flutter
version: 0.2.5
homepage: https://github.com/notDmDrl/material_3_tools
repository: https://github.com/notDmDrl/material_3_tools

publish_to: none

environment:
  sdk: ^3.13.0-0

dependencies:
  flutter:
    sdk: flutter

  material_ui:
    git:
      url: https://github.com/flutter/packages.git
      path: packages/material_ui
      ref: m3e_migration

dev_dependencies:
  yet_another_lint:
    git: https://github.com/notDmDrl/yet_another_lint.git
